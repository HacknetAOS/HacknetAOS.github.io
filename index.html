<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hacknet OS - Linux Distribution</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="viewport">
    <div id="screen-container">
      <!-- Procedural Animated Hexagon Background -->
      <canvas id="hex-canvas" width="1920" height="1080"></canvas>

      <!-- CRT Scanlines Overlay -->
      <div id="scanlines"></div>

      <!-- Main UI Group -->
      <div id="main-menu">
        <!-- HACKNET OS Vector Logo -->
        <div id="logo-container">
          <svg id="hacknet-logo" viewBox="0 0 452 59" width="452" height="59" xmlns="http://www.w3.org/2000/svg">
            <path d="M 291 0 L 291 13 L 307 13 L 308 14 L 308 58 L 320 58 L 321 57 L 321 14 L 322 13 L 337 13 L 337 0 Z M 243 0 L 243 58 L 288 58 L 289 57 L 289 46 L 267 46 L 266 45 L 257 45 L 256 44 L 256 36 L 257 35 L 277 35 L 277 23 L 256 23 L 255 22 L 255 14 L 256 13 L 289 13 L 289 0 Z M 194 0 L 194 58 L 205 58 L 206 57 L 206 27 L 207 26 L 228 47 L 228 57 L 229 58 L 240 58 L 240 0 L 228 0 L 228 25 L 227 26 L 226 26 L 206 6 L 206 0 Z M 146 0 L 146 58 L 154 58 L 155 57 L 158 57 L 158 39 L 159 38 L 179 58 L 180 58 L 181 57 L 182 57 L 183 58 L 191 58 L 191 50 L 171 30 L 171 29 L 191 9 L 191 0 L 179 0 L 179 1 L 177 3 L 176 3 L 159 20 L 158 19 L 158 1 L 157 0 Z M 97 0 L 97 58 L 143 58 L 143 45 L 142 45 L 141 46 L 118 46 L 117 45 L 115 45 L 114 46 L 113 46 L 112 45 L 110 45 L 109 44 L 109 14 L 110 13 L 143 13 L 143 0 Z M 48 0 L 48 57 L 49 58 L 57 58 L 58 57 L 60 57 L 60 47 L 61 46 L 81 46 L 82 47 L 82 57 L 85 57 L 86 58 L 94 58 L 94 0 Z M 62 13 L 81 13 L 82 14 L 82 33 L 81 34 L 61 34 L 60 33 L 60 15 Z M 0 0 L 0 57 L 12 57 L 12 36 L 13 35 L 32 35 L 34 37 L 34 57 L 35 57 L 36 58 L 45 58 L 46 57 L 46 0 L 34 0 L 34 21 L 33 22 L 13 22 L 12 21 L 12 0 Z M 356 0 L 403 0 L 403 58 L 356 58 Z M 368 13 L 391 13 L 391 45 L 368 45 Z M 405 0 L 452 0 L 452 13 L 417 13 L 417 23 L 452 23 L 452 58 L 405 58 L 405 45 L 440 45 L 440 35 L 405 35 Z" fill="#ffffff" fill-rule="evenodd" />
          </svg>
        </div>

        <!-- Menu Action Buttons -->
        <div id="buttons-list">
          <!-- Button 1: Download ISO -->
          <button class="menu-btn btn-large btn-download-primary" id="btn-download" data-action="download">
            <span class="btn-accent"></span>
            <span class="btn-text" id="download-text" data-text="Download ISO (x86_64)">Download ISO (x86_64)</span>
            <span class="btn-meta" id="release-meta">v0.1 | 1.82 GB</span>
          </button>

          <!-- Button 2: Verify Checksums -->
          <button class="menu-btn btn-large" id="btn-verify" data-action="verify">
            <span class="btn-accent"></span>
            <span class="btn-text" id="verify-text" data-text="Verify Checksums (SHA256)">Verify Checksums (SHA256)</span>
          </button>

          <!-- Button 3: Source Code (Direct to GitHub) -->
          <a class="menu-btn btn-small" id="btn-source" href="https://github.com/HacknetAOS" target="_blank" rel="noopener noreferrer">
            <span class="btn-accent"></span>
            <span class="btn-text" data-text="Source Code [GitHub]">Source Code [GitHub]</span>
          </a>
        </div>
      </div>

      <!-- Quick Audio Controls (Top Right - Matches Other Buttons, No Icons) -->
      <div id="status-bar">
        <button id="audio-toggle" title="Toggle Soundtrack" class="status-btn">
          <span class="status-accent"></span>
          <span id="audio-label">AUDIO: OFF</span>
        </button>
      </div>

      <!-- Modal Window Styled Directly from Button Design -->
      <div id="modal-overlay" class="hidden">
        <div id="hacknet-window">
          <div class="window-accent"></div>
          <div class="window-inner">
            <div class="window-header">
              <span id="window-title">TERMINAL</span>
              <button id="window-close" class="window-close-btn" title="Close">×</button>
            </div>
            <div class="window-body" id="window-body">
              <!-- Content injected dynamically -->
            </div>
          </div>
        </div>
      </div>

      <!-- Custom Hacknet Cursor -->
      <div id="custom-cursor">
        <svg width="19" height="23" viewBox="0 0 19 23" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M1 1V19L5.5 14.5L9.5 22.5L12.5 21L8.5 13H15L1 1Z" fill="white" stroke="black" stroke-width="1.5" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- Soundtrack -->
  <audio id="bgm" src="audio.mp3" loop preload="auto"></audio>

  <script src="app.js"></script>
</body>
</html>
